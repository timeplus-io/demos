apiVersion: enterprise.splunk.com/v4
kind: Standalone
metadata:
  name: single
  namespace: splunk-operator
spec:
  resources:
    requests:
      memory: "512Mi"
      cpu: "0.1"
    limits:
      memory: "8Gi"
      cpu: "4"
  etcVolumeStorageConfig:
    storageClassName: timeplus-storage-class
    storageCapacity: 10Gi
  varVolumeStorageConfig:
    storageClassName: timeplus-storage-class
    storageCapacity: 100Gi
  extraEnv:
    # accept the Splunk General Terms (required by Splunk Enterprise 9.4+ images)
    - name: SPLUNK_GENERAL_TERMS
      value: "--accept-sgt-current-at-splunk-com"
    - name: SPLUNK_HEC_PORT
      value: "8088"
    - name: SPLUNK_PASSWORD
      value: "Password!"
  # Optional: Add defaults to configure HEC
  defaults: |-
    splunk:
      hec:
        port: 8088
        enable: true